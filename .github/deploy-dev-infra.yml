name: Deploy Dev / Non-Prod Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy Non-Prod Core Network
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_NONPROD_SUBSCRIPTION_ID }}

      - name: Deploy Non-Prod Bicep Infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: 'subscription'
          region: 'australiaeast'
          subscriptionId: ${{ secrets.AZURE_NONPROD_SUBSCRIPTION_ID }}
          template: './infra/main.bicep'
          parameters: './infra/main.dev.bicepparam'
          deploymentMode: 'Incremental'